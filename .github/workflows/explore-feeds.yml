name: Explore News Feeds (diagnostic)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run feed exploration (read-only, no commit)
        run: python3 collector/explore_feeds.py

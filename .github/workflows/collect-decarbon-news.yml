name: Collect Decarbonation News

on:
  workflow_dispatch: {}
  schedule:
    - cron: '20 */3 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-decarbon-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pypdf

      - name: '[TEMP] env.go.jp press page diagnosis'
        run: |
          set -x
          curl -sL -A "Mozilla/5.0 (compatible; NewsPortalDEC-Collector/1.0)" -o /tmp/env_press.html -w "HTTP_STATUS:%{http_code}\n" https://www.env.go.jp/press/
          echo "----- byte size -----"
          wc -c /tmp/env_press.html
          echo "----- first 300 lines -----"
          head -n 300 /tmp/env_press.html
          echo "----- anchor tags sample -----"
          grep -oE '<a [^>]*href="[^"]*"[^>]*>[^<]{0,80}' /tmp/env_press.html | head -n 60

      - name: Run collector
        run: python3 collector/collect.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/articles.json site/data/feed.json site/data/categories.json site/data/topics.json site/data/ranks.json site/data/kpis.json site/data/dashboard.json site/data/rail-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update decarbonation news data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref ${{ github.ref_name }}

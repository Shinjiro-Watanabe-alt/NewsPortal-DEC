name: Collect Decarbonation News

on:
  workflow_dispatch: {}
  schedule:
    - cron: '20 */3 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-decarbon-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pypdf

      - name: Run collector
        run: python3 collector/collect.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/articles.json site/data/feed.json site/data/categories.json site/data/topics.json site/data/ranks.json site/data/kpis.json site/data/dashboard.json site/data/rail-data.json site/data/events.json site/data/meta.json site/data/subsidies.json site/data/glossary_pending.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update decarbonation news data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref ${{ github.ref_name }}

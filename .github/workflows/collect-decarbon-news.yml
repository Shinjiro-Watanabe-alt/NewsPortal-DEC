name: Collect Decarbonation News

on:
  workflow_dispatch: {}
  schedule:
    - cron: '20 */3 * * *'

permissions:
  contents: write

concurrency:
  group: collect-decarbon-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run collector
        run: python3 collector/collect.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/articles.json site/data/feed.json site/data/categories.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update decarbonation news data"
            git push
          fi
